name: Unlock GitHub Achievements

on:
  workflow_dispatch:
    inputs:
      pull_shark_count:
        description: "Merged PRs to create (2=base, 16=bronze, 128=silver)"
        required: false
        default: "16"
        type: choice
        options:
          - "2"
          - "12"
          - "16"
          - "128"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Quickdraw — close issue within 5 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create --title "Achievement unlock: Quickdraw" --body "Automated issue for Quickdraw badge.")
          echo "Created $ISSUE_URL"
          sleep 20
          gh issue close "$ISSUE_URL"

      - name: Initialize achievements log
        run: |
          git pull origin main
          if [ ! -f achievements-log.md ]; then
            printf '# Achievement Log\n\nAutomated entries for GitHub profile achievements.\n' > achievements-log.md
            git add achievements-log.md
            git commit -m "chore: initialize achievements log"
            git push origin main
          fi

      - name: YOLO + Pull Shark — merge PRs without review
        uses: actions/github-script@v7
        env:
          PR_COUNT: ${{ github.event.inputs.pull_shark_count || '16' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const count = parseInt(process.env.PR_COUNT, 10);

            const git = (cmd) => execSync(cmd, { stdio: 'inherit' });
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let i = 1; i <= count; i++) {
              git('git fetch origin main');
              git('git checkout main');
              git('git pull origin main');

              const branch = `achievement/pull-shark-${i}-${Date.now()}`;
              git(`git checkout -b ${branch}`);

              const entry = `- Pull Shark PR #${i} — ${new Date().toISOString()}\n`;
              fs.appendFileSync('achievements-log.md', entry);
              git('git add achievements-log.md');
              git(`git commit -m "achievement: pull shark PR ${i}"`);
              git(`git push origin ${branch}`);

              await sleep(3000);

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `Achievement: Pull Shark #${i}`,
                head: branch,
                base: 'main',
                body: 'Automated PR for Pull Shark / YOLO achievements.'
              });

              console.log(`Created PR #${pr.number}: ${pr.html_url}`);

              for (let attempt = 1; attempt <= 10; attempt++) {
                try {
                  const { data: mergeResult } = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pr.number,
                    merge_method: 'merge'
                  });
                  console.log(`Merged PR #${pr.number}: ${mergeResult.message}`);
                  break;
                } catch (error) {
                  if (attempt === 10) throw error;
                  console.log(`Merge attempt ${attempt} failed, retrying...`);
                  await sleep(3000);
                }
              }

              await sleep(2000);
            }

      - name: Pair Extraordinaire — co-authored merged PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const git = (cmd) => execSync(cmd, { stdio: 'inherit' });
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            git('git fetch origin main');
            git('git checkout main');
            git('git pull origin main');

            const branch = `achievement/pair-extraordinaire-${Date.now()}`;
            git(`git checkout -b ${branch}`);

            fs.appendFileSync('achievements-log.md', `- Pair Extraordinaire — ${new Date().toISOString()}\n`);
            git('git add achievements-log.md');
            git('git commit -m "achievement: pair extraordinaire" -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"');
            git(`git push origin ${branch}`);

            await sleep(3000);

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Achievement: Pair Extraordinaire',
              head: branch,
              base: 'main',
              body: 'Co-authored commit for Pair Extraordinaire badge.'
            });

            for (let attempt = 1; attempt <= 10; attempt++) {
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'merge'
                });
                console.log(`Merged Pair Extraordinaire PR #${pr.number}`);
                break;
              } catch (error) {
                if (attempt === 10) throw error;
                await sleep(3000);
              }
            }

      - name: Summary
        run: |
          echo "Achievement unlock complete."
          echo "Check your badges: https://github.com/barialay?tab=achievements"
          echo "Badges may take up to 24 hours to appear."
