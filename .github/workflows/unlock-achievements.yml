name: Unlock GitHub Achievements

on:
  workflow_dispatch:
    inputs:
      pull_shark_count:
        description: "Extra PRs to merge for higher Pull Shark tiers"
        required: false
        default: "12"
        type: choice
        options:
          - "1"
          - "12"
          - "14"
          - "124"
          - "1020"

permissions:
  contents: write
  pull-requests: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Initialize achievements log
        run: |
          git pull origin main
          if [ ! -f achievements-log.md ]; then
            printf '# Achievement Log\n\nAutomated entries for GitHub profile achievements.\n' > achievements-log.md
            git add achievements-log.md
            git commit -m "chore: initialize achievements log"
            git push origin main
          fi

      - name: YOLO + Pull Shark tiers — merge PRs without review
        uses: actions/github-script@v7
        env:
          PR_COUNT: ${{ github.event.inputs.pull_shark_count || '12' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const count = parseInt(process.env.PR_COUNT, 10);

            const git = (cmd) => execSync(cmd, { stdio: 'inherit' });
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            console.log(`Creating and merging ${count} PR(s) for YOLO / Pull Shark tiers...`);

            for (let i = 1; i <= count; i++) {
              git('git fetch origin main');
              git('git checkout main');
              git('git pull origin main');

              const branch = `achievement/pull-shark-${i}-${Date.now()}`;
              git(`git checkout -b ${branch}`);

              const entry = `- Pull Shark PR #${i} — ${new Date().toISOString()}\n`;
              fs.appendFileSync('achievements-log.md', entry);
              git('git add achievements-log.md');
              git(`git commit -m "achievement: pull shark PR ${i}"`);
              git(`git push origin ${branch}`);

              await sleep(3000);

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `Achievement: Pull Shark #${i}`,
                head: branch,
                base: 'main',
                body: 'Automated PR merged without review for YOLO / Pull Shark achievements.'
              });

              console.log(`Created PR #${pr.number}: ${pr.html_url}`);

              for (let attempt = 1; attempt <= 10; attempt++) {
                try {
                  const { data: mergeResult } = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pr.number,
                    merge_method: 'merge'
                  });
                  console.log(`Merged PR #${pr.number}: ${mergeResult.message}`);
                  break;
                } catch (error) {
                  if (attempt === 10) throw error;
                  console.log(`Merge attempt ${attempt} failed, retrying...`);
                  await sleep(3000);
                }
              }

              await sleep(2000);
            }

      - name: Summary
        run: |
          echo "Targets: YOLO + Pull Shark tier progress"
          echo "Skipped: Quickdraw, Pair Extraordinaire (already earned)"
          echo "Check badges: https://github.com/barialay?tab=achievements"

      - name: Cleanup — remove achievement files
        run: |
          git checkout main
          git pull origin main
          rm -f achievements-log.md
          rm -f .github/workflows/unlock-achievements.yml
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "chore: remove achievement unlock files after completion"
            git push origin main
          fi
