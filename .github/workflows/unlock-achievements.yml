name: Unlock GitHub Achievements

on:
  workflow_dispatch:
    inputs:
      pull_shark_count:
        description: "Merged PRs to create (2=base, 16=bronze, 128=silver)"
        required: false
        default: "16"
        type: choice
        options:
          - "2"
          - "16"
          - "128"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "barialay"
          git config user.email "57029478+barialay@users.noreply.github.com"

      - name: Quickdraw — close issue within 5 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create --title "Achievement unlock: Quickdraw" --body "Automated issue for Quickdraw badge.")
          echo "Created $ISSUE_URL"
          sleep 20
          gh issue close "$ISSUE_URL"
          echo "Quickdraw step complete."

      - name: YOLO + Pull Shark — merge PRs without review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COUNT: ${{ github.event.inputs.pull_shark_count || '16' }}
        run: |
          git pull origin main
          touch achievements-log.md
          if ! grep -q "# Achievement Log" achievements-log.md 2>/dev/null; then
            echo "# Achievement Log" > achievements-log.md
            echo "" >> achievements-log.md
            echo "Automated entries for GitHub profile achievements." >> achievements-log.md
            git add achievements-log.md
            git commit -m "chore: initialize achievements log"
            git push origin main
          fi

          for i in $(seq 1 "$PR_COUNT"); do
            BRANCH="achievement/pull-shark-$i-$(date +%s)"
            git checkout main
            git pull origin main
            git checkout -b "$BRANCH"
            echo "- Pull Shark PR #$i — $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> achievements-log.md
            git add achievements-log.md
            git commit -m "achievement: pull shark PR $i"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --title "Achievement: Pull Shark #$i" --body "Automated PR for Pull Shark / YOLO achievements." --head "$BRANCH" --base main)
            gh pr merge "$PR_URL" --merge --admin
            echo "Merged $PR_URL"
            sleep 3
          done

      - name: Pair Extraordinaire — co-authored merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git pull origin main
          BRANCH="achievement/pair-extraordinaire-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "- Pair Extraordinaire — $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> achievements-log.md
          git add achievements-log.md
          git commit -m "achievement: pair extraordinaire

          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "Achievement: Pair Extraordinaire" --body "Co-authored commit for Pair Extraordinaire badge." --head "$BRANCH" --base main)
          gh pr merge "$PR_URL" --merge --admin
          echo "Pair Extraordinaire step complete."

      - name: Summary
        run: |
          echo "Achievement unlock workflow finished."
          echo "Badges may take up to 24 hours to appear on your GitHub profile."
          echo "Check: https://github.com/barialay?tab=achievements"
