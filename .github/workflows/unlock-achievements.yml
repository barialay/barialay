name: Unlock GitHub Achievements

on:
  workflow_dispatch:
    inputs:
      pull_shark_count:
        description: "Extra merged PRs to create (12 reaches bronze from 4 existing, 16 for full bronze batch)"
        required: false
        default: "16"
        type: choice
        options:
          - "12"
          - "16"
          - "128"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Quickdraw — close issue within 5 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create --title "Achievement unlock: Quickdraw" --body "Automated issue for Quickdraw badge.")
          echo "Created $ISSUE_URL"
          sleep 20
          gh issue close "$ISSUE_URL"

      - name: YOLO + Pull Shark — merge PRs without review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COUNT: ${{ github.event.inputs.pull_shark_count || '16' }}
        run: |
          git pull origin main

          if [ ! -f achievements-log.md ]; then
            printf '# Achievement Log\n\nAutomated entries for GitHub profile achievements.\n' > achievements-log.md
            git add achievements-log.md
            git commit -m "chore: initialize achievements log"
            git push origin main
          fi

          for i in $(seq 1 "$PR_COUNT"); do
            git checkout main
            git pull origin main
            BRANCH="achievement/pull-shark-$i-$(date +%s)"
            git checkout -b "$BRANCH"
            echo "- Pull Shark PR #$i — $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> achievements-log.md
            git add achievements-log.md
            git commit -m "achievement: pull shark PR $i"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --title "Achievement: Pull Shark #$i" --body "Automated PR for Pull Shark / YOLO achievements." --head "$BRANCH" --base main)
            gh pr merge "$PR_URL" --merge --admin
            sleep 2
          done

      - name: Pair Extraordinaire — co-authored merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git pull origin main
          BRANCH="achievement/pair-extraordinaire-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "- Pair Extraordinaire — $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> achievements-log.md
          git add achievements-log.md
          git commit -m "achievement: pair extraordinaire" -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "Achievement: Pair Extraordinaire" --body "Co-authored commit for Pair Extraordinaire badge." --head "$BRANCH" --base main)
          gh pr merge "$PR_URL" --merge --admin

      - name: Summary
        run: |
          echo "Done. Check https://github.com/barialay?tab=achievements in up to 24 hours."
